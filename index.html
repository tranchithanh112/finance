<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f5fa">
  <script>
    // Áp theme trước khi vẽ trang để không bị nháy màu
    (function () {
      try {
        var t = localStorage.getItem('fin.theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Finance">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>Finance Dashboard</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo"></span><span class="brand-name">Finance</span><span class="page-title" id="page-title"></span></div>
    <nav class="tabs" id="tabs" aria-label="Điều hướng"></nav>
    <div class="actions">
      <select id="cur-select" class="cur" aria-label="Tiền tệ hiển thị">
        <option>USD</option>
        <option>VND</option>
      </select>
      <button class="icon-btn" id="btn-theme" title="Giao diện sáng / tối"></button>
      <button class="icon-btn" id="btn-refresh" title="Làm mới số dư & giá"></button>
      <button class="pill" id="sync-status"></button>
    </div>
  </header>

  <main>
    <section class="tab" id="tab-overview"></section>
    <section class="tab" id="tab-budget" hidden></section>
    <section class="tab" id="tab-crypto" hidden></section>
    <section class="tab" id="tab-pnl" hidden></section>
    <section class="tab" id="tab-futures" hidden></section>
    <section class="tab" id="tab-stocks" hidden></section>
    <section class="tab" id="tab-settings" hidden></section>
  </main>

  <button class="fab" id="fab" aria-label="Ghi thu chi"></button>
  <nav class="bottom-nav" id="bottom-nav" aria-label="Điều hướng"></nav>
  <div class="sheet" id="more-sheet" hidden><div class="sheet-panel" id="more-panel"></div></div>

  <div id="toasts" aria-live="polite"></div>
</body>
</html>
