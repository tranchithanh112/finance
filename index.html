<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Finance Dashboard</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%234f7cff'/><path d='M8 22l5-6 4 3 7-9' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo"></span>Finance</div>
    <nav class="tabs" id="tabs">
      <button data-tab="overview">Tổng quan</button>
      <button data-tab="crypto">Crypto</button>
      <button data-tab="pnl">Lịch sử & PnL</button>
      <button data-tab="stocks">Chứng khoán</button>
      <button data-tab="settings">Cài đặt</button>
    </nav>
    <div class="actions">
      <select id="cur-select" aria-label="Tiền tệ hiển thị">
        <option>USD</option>
        <option>VND</option>
      </select>
      <button class="btn" id="btn-refresh" title="Làm mới số dư & giá">↻ Làm mới</button>
      <button class="pill" id="sync-status"></button>
    </div>
  </header>

  <main>
    <section class="tab" id="tab-overview"></section>
    <section class="tab" id="tab-crypto" hidden></section>
    <section class="tab" id="tab-pnl" hidden></section>
    <section class="tab" id="tab-stocks" hidden></section>
    <section class="tab" id="tab-settings" hidden></section>
  </main>

  <div id="toasts" aria-live="polite"></div>
</body>
</html>
