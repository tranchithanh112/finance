<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f2ec">
  <script>
    // Áp theme, bảng màu và ngôn ngữ trước khi vẽ trang để không bị nháy
    (function () {
      try {
        var d = document.documentElement;
        var t = localStorage.getItem('fin.theme');
        if (t === 'light' || t === 'dark') d.setAttribute('data-theme', t);
        var p = localStorage.getItem('fin.palette');
        if (p && p !== 'bronze') d.setAttribute('data-palette', p);
        if (localStorage.getItem('fin.lang') === 'en') d.lang = 'en';
      } catch (e) {}
      // Font tải song song, không chặn việc vẽ trang (chưa tải xong thì dùng font hệ thống)
      var f = document.createElement('link');
      f.rel = 'stylesheet';
      f.href = 'https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap';
      document.head.appendChild(f);
    })();
  </script>
  <style>
    /* Màn hình chờ: vẽ ngay từ HTML, trước khi CSS / JS của app tải xong */
    html { background: #f6f2ec; }
    @media (prefers-color-scheme: dark) { html:not([data-theme="light"]) { background: #0e0c0a; } }
    html[data-theme="dark"] { background: #0e0c0a; }
    #splash { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; background: inherit; background-color: #f6f2ec; color: #6b5b4a; font: 600 15px/1.2 system-ui, -apple-system, sans-serif;
      transition: opacity .35s ease, transform .35s ease; }
    @media (prefers-color-scheme: dark) { html:not([data-theme="light"]) #splash { background-color: #0e0c0a; color: #b8a68f; } }
    html[data-theme="dark"] #splash { background-color: #0e0c0a; color: #b8a68f; }
    #splash img { width: 76px; height: 76px; border-radius: 20px; box-shadow: 0 10px 30px rgb(0 0 0 / .25); animation: sp-pop .5s ease-out both; }
    #splash .sp-name { letter-spacing: .02em; opacity: .9; }
    #splash .sp-bar { width: 96px; height: 3px; border-radius: 3px; background: rgb(127 110 90 / .2); overflow: hidden; }
    #splash .sp-bar i { display: block; width: 40%; height: 100%; border-radius: 3px; background: #b8905f; animation: sp-load 1s ease-in-out infinite; }
    #splash.hide { opacity: 0; transform: scale(1.04); pointer-events: none; }
    @keyframes sp-pop { from { transform: scale(.85); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes sp-load { from { transform: translateX(-110%); } to { transform: translateX(260%); } }
    @media (prefers-reduced-motion: reduce) { #splash img, #splash .sp-bar i { animation: none; } }
  </style>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="iF">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>iF Finance</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/themes.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js" integrity="sha384-dug+JxfBvklEQdJ4AYuBBAIScUz0bVN73xpy273gcAwHjb3qI0fXmuYNaNfdyYJG" crossorigin="anonymous" async></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="splash" aria-hidden="true"><img src="icons/icon.svg" alt=""><div class="sp-name">iFinance</div><div class="sp-bar"><i></i></div></div>
  <header class="topbar">
    <div class="brand">
      <span class="logo"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="logo-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--logo-a)"/><stop offset=".55" style="stop-color:var(--logo-b)"/><stop offset="1" style="stop-color:var(--logo-c)"/></linearGradient><linearGradient id="logo-gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--logo-fg1)"/><stop offset="1" style="stop-color:var(--logo-fg2)"/></linearGradient></defs><rect width="32" height="32" rx="9" fill="url(#logo-g)"/><path d="M4 25.5 L11 21 L16 23 L28 13" fill="none" style="stroke:var(--logo-fg1)" stroke-opacity=".3" stroke-width="1.2" stroke-linecap="round"/><circle cx="10.6" cy="9" r="2.3" fill="url(#logo-gg)"/><rect x="8.8" y="12.6" width="3.6" height="11.4" rx="1.3" style="fill:var(--logo-i)"/><rect x="15.4" y="7.6" width="3.7" height="16.4" rx="1.3" fill="url(#logo-gg)"/><rect x="15.4" y="7.6" width="10.2" height="3.6" rx="1.3" fill="url(#logo-gg)"/><rect x="15.4" y="14.3" width="7.8" height="3.4" rx="1.2" fill="url(#logo-gg)"/></svg></span>
      <span class="brand-name">i<em>F</em>inance</span><span class="page-title" id="page-title"></span>
    </div>
    <nav class="tabs" id="tabs" aria-label="Điều hướng"></nav>
    <div class="actions">
      <select id="cur-select" class="cur" aria-label="Tiền tệ hiển thị">
        <option>USD</option>
        <option>VND</option>
      </select>
      <button class="icon-btn" id="btn-privacy" title="Ẩn / hiện số dư"></button>
      <button class="icon-btn" id="btn-theme" title="Giao diện sáng / tối"></button>
      <button class="icon-btn" id="btn-refresh" title="Làm mới số dư & giá"></button>
      <button class="pill" id="sync-status"></button>
    </div>
  </header>

  <section class="lock" id="lock" hidden></section>

  <main>
    <section class="tab" id="tab-overview"></section>
    <section class="tab" id="tab-budget" hidden></section>
    <section class="tab" id="tab-crypto" hidden></section>
    <section class="tab" id="tab-pnl" hidden></section>
    <section class="tab" id="tab-futures" hidden></section>
    <section class="tab" id="tab-stocks" hidden></section>
    <section class="tab" id="tab-settings" hidden></section>
  </main>

  <button class="fab" id="fab" aria-label="Ghi thu chi"></button>
  <nav class="bottom-nav" id="bottom-nav" aria-label="Điều hướng"></nav>
  <div class="sheet" id="more-sheet" hidden><div class="sheet-panel" id="more-panel"></div></div>

  <div id="toasts" aria-live="polite"></div>
</body>
</html>
