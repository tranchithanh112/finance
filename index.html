<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f5f1">
  <script>
    // Áp theme trước khi vẽ trang để không bị nháy màu
    (function () {
      try {
        var t = localStorage.getItem('fin.theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="iF">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>iF Finance</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" aria-label="iF"><defs><linearGradient id="logo-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#04160f"/><stop offset=".55" stop-color="#0b3a27"/><stop offset="1" stop-color="#17744c"/></linearGradient><linearGradient id="logo-gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1d9a6"/><stop offset="1" stop-color="#c79a45"/></linearGradient></defs><rect width="32" height="32" rx="9" fill="url(#logo-g)"/><path d="M4 25.5 L11 21 L16 23 L28 13" fill="none" stroke="#dcb66e" stroke-opacity=".3" stroke-width="1.2" stroke-linecap="round"/><circle cx="10.6" cy="9" r="2.3" fill="url(#logo-gg)"/><rect x="8.8" y="12.6" width="3.6" height="11.4" rx="1.3" fill="#fff"/><rect x="15.4" y="7.6" width="3.7" height="16.4" rx="1.3" fill="url(#logo-gg)"/><rect x="15.4" y="7.6" width="10.2" height="3.6" rx="1.3" fill="url(#logo-gg)"/><rect x="15.4" y="14.3" width="7.8" height="3.4" rx="1.2" fill="url(#logo-gg)"/></svg></span><span class="brand-name">i<em>F</em>inance</span><span class="page-title" id="page-title"></span></div>
    <nav class="tabs" id="tabs" aria-label="Điều hướng"></nav>
    <div class="actions">
      <select id="cur-select" class="cur" aria-label="Tiền tệ hiển thị">
        <option>USD</option>
        <option>VND</option>
      </select>
      <button class="icon-btn" id="btn-theme" title="Giao diện sáng / tối"></button>
      <button class="icon-btn" id="btn-refresh" title="Làm mới số dư & giá"></button>
      <button class="pill" id="sync-status"></button>
    </div>
  </header>

  <main>
    <section class="tab" id="tab-overview"></section>
    <section class="tab" id="tab-budget" hidden></section>
    <section class="tab" id="tab-crypto" hidden></section>
    <section class="tab" id="tab-pnl" hidden></section>
    <section class="tab" id="tab-futures" hidden></section>
    <section class="tab" id="tab-stocks" hidden></section>
    <section class="tab" id="tab-settings" hidden></section>
  </main>

  <button class="fab" id="fab" aria-label="Ghi thu chi"></button>
  <nav class="bottom-nav" id="bottom-nav" aria-label="Điều hướng"></nav>
  <div class="sheet" id="more-sheet" hidden><div class="sheet-panel" id="more-panel"></div></div>

  <div id="toasts" aria-live="polite"></div>
</body>
</html>
