<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f5f7fa" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Finance">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>Finance Dashboard</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo"></span>Finance</div>
    <nav class="tabs" id="tabs">
      <button data-tab="overview">Tổng quan</button>
      <button data-tab="crypto">Crypto</button>
      <button data-tab="pnl">Lịch sử & PnL</button>
      <button data-tab="stocks">Chứng khoán</button>
      <button data-tab="settings">Cài đặt</button>
    </nav>
    <div class="actions">
      <select id="cur-select" aria-label="Tiền tệ hiển thị">
        <option>USD</option>
        <option>VND</option>
      </select>
      <button class="btn" id="btn-refresh" title="Làm mới số dư & giá">↻<span class="label"> Làm mới</span></button>
      <button class="pill" id="sync-status"></button>
    </div>
  </header>

  <main>
    <section class="tab" id="tab-overview"></section>
    <section class="tab" id="tab-crypto" hidden></section>
    <section class="tab" id="tab-pnl" hidden></section>
    <section class="tab" id="tab-stocks" hidden></section>
    <section class="tab" id="tab-settings" hidden></section>
  </main>

  <div id="toasts" aria-live="polite"></div>
</body>
</html>
